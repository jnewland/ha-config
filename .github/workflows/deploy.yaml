name: cd
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
concurrency:
  group: cd-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      ha-config: ${{ steps.filter.outputs.ha-config }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            ha-config:
              - '**'
              - '!.*/**'
              - '!doc/**'
              - '!**/*.md'
              - '!.*'

  validate-config:
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ha-config == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate fake SSL cert
        run: |
          openssl req -x509 -newkey rsa:2048 -subj '/CN=example.com' -nodes -keyout key.pem -out cert.pem
      - name: Test config
        uses: docker://homeassistant/home-assistant:2026.7.4@sha256:5a531753cea96444200158fc2b0ac7ccd739291ec50414877b396de6e0bb29b3
        with:
          entrypoint: ./script/cibuild

  update-branch:
    if: github.event_name == 'pull_request'
    uses: jnewland/.github/.github/workflows/update-branch.yaml@9cb74ffde4b52168439870ab437669347f3dcc07 # main
    concurrency: update-branch-main
    with:
      pull_number: ${{ github.event.pull_request.number }}
    secrets:
      token: ${{ secrets.UR_BOT_TOKEN }}

  script-deploy:
    runs-on: ubuntu-latest
    needs:
      - validate-config
      - update-branch
    if: |
      !failure() && !cancelled() &&
      (
        github.event_name == 'push' ||
        ( github.event.action == 'labeled' && github.event.label.name == 'deploy') ||
        ( github.event.action != 'opened' && github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'deploy') )
      )
    environment: production
    concurrency: production
    steps:
      - name: deploy
        run: "true"

  create-deploy-status:
    runs-on: ubuntu-latest
    needs: script-deploy
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha:         context.payload.pull_request.head.sha,
              state:       'success',
              context:     'deploy',
              description: 'PR was deployed with GitHub Actions',
              target_url:  'https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
