title: Remediation
icon: mdi:water-alert
cards:
  - type: markdown
    content: >
      ### Water damage remediation


      **Containment:** stairs · upstairs · great hall · guest hall


      Everything else is uncontained. Flip everything in the cards below off
      while crews are working: motion shouldn't trip lights or speakers, modes
      shouldn't fire scenes, and neither HVAC system should run.

  # -------------------------------------------------------------------- HVAC
  - type: markdown
    title: HVAC
    content: |
      {%- set u = states('climate.upstairs') -%}
      {%- set d = states('climate.downstairs') -%}
      {%- set guards = ['automation.upstairs_ac', 'automation.upstairs_reading', 'automation.upstairs_heat'] -%}
      {%- set ns = namespace(on=[]) -%}
      {%- for e in guards -%}
        {%- if is_state(e, 'on') -%}
          {%- set ns.on = ns.on + [state_attr(e, 'friendly_name') or e] -%}
        {%- endif -%}
      {%- endfor -%}
      {% if u == 'off' and d == 'off' and ns.on | count == 0 %}
      ## ✅ Both HVAC systems are OFF
      Nothing is set to turn them back on.
      {% else %}
      ## ⚠️ HVAC is not fully shut down
      - upstairs: **{{ u }}**{% if u != 'off' %} — set to off below{% endif %}

      - downstairs: **{{ d }}**{% if d != 'off' %} — set to off below{% endif %}
      {% if ns.on | count > 0 %}

      These automations will turn the upstairs system back on:
      {% for a in ns.on %}
      - {{ a }}
      {%- endfor %}
      {% endif %}
      {% endif %}

  - type: tile
    entity: climate.upstairs
    name: upstairs HVAC
    state_content: hvac_action
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - "off"
          - cool
          - heat
          - heat_cool

  - type: tile
    entity: climate.downstairs
    name: downstairs HVAC
    state_content: hvac_action
    features:
      - type: climate-hvac-modes
        hvac_modes:
          - "off"
          - cool
          - heat
          - heat_cool

  - type: thermostat
    entity: climate.upstairs
  - type: thermostat
    entity: climate.downstairs

  # ----------------------------------------------------------------- toggles
  - type: markdown
    title: Automations still enabled
    content: |
      {%- set watched = [
        'automation.upstairs_ac',
        'automation.upstairs_reading',
        'automation.upstairs_heat',
        'automation.turn_on_related_speakers',
        'automation.turn_off_related_speakers',
        'automation.turn_on_lights_when_motion_is_detected',
        'automation.turn_on_switches_when_motion_is_detected',
        'automation.turn_off_lights_after_sensors_have_turned_off',
        'automation.turn_off_lights_with_delay',
        'automation.turn_off_lights_immediately',
        'automation.set_lights_to_correct_brightness_when_turned_on',
        'automation.correct_light_brightness',
        'automation.set_lights_to_correct_color_temp_when_turned_on',
        'automation.react_to_changes_of_the_brightness_slider',
        'automation.toggle_sleep_mode_on_adapative_lighting_switches',
        'automation.turn_off_color_adjustment_on_some_adapative_lighting_configurations',
        'automation.cabinet_sync_on',
        'automation.cabinet_sync_off',
        'automation.network_closet_lights',
        'automation.haunt_lights',
        'automation.indoor_grow_led_automation',
        'automation.indoor_grow_led_off',
        'automation.mode_selector',
        'automation.morning_mode',
        'automation.morning_to_day',
        'automation.run_default_morning_actions',
        'automation.mode_away_to_day',
        'automation.mode_day_to_evening',
        'automation.reading_mode',
        'automation.away_mode'
      ] -%}
      {%- set watched_switches = [
        ['switch.circadian_lighting_brightness', 'circadian: brightness'],
        ['switch.circadian_lighting_color_bright', 'circadian: color bright'],
        ['switch.circadian_lighting_color_accent', 'circadian: color accent'],
        ['switch.circadian_lighting_brighter_accent', 'circadian: brighter accent'],
        ['switch.circadian_lighting_min_brightness', 'circadian: min brightness'],
        ['switch.adaptive_lighting_chandelier', 'adaptive: chandelier'],
        ['switch.adaptive_lighting_cans', 'adaptive: cans'],
        ['switch.adaptive_lighting_living_cans', 'adaptive: living cans']
      ] -%}
      {%- set total = (watched | count) + (watched_switches | count) -%}
      {%- set ns = namespace(on=[]) -%}
      {%- for e in watched -%}
        {%- if is_state(e, 'on') -%}
          {%- set ns.on = ns.on + [state_attr(e, 'friendly_name') or e] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for e, label in watched_switches -%}
        {%- if is_state(e, 'on') -%}
          {%- set ns.on = ns.on + [label] -%}
        {%- endif -%}
      {%- endfor -%}
      {% if ns.on | count == 0 %}
      ## ✅ All {{ total }} are off
      {% else %}
      ## ⚠️ {{ ns.on | count }} of {{ total }} still on
      {% for a in ns.on %}
      - {{ a }}
      {%- endfor %}
      {% endif %}

