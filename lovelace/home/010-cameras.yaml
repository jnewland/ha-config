title: Cameras
icon: mdi:video
path: cameras
cards:
  - type: conditional
    conditions:
      - condition: state
        entity: camera.crate_medium
        state_not: unavailable
    card:
      type: vertical-stack
      cards:
        - type: picture-entity
          camera_view: auto
          show_name: false
          show_state: false
          entity: camera.crate_medium
        - type: markdown
          content: >
            {{ states('input_text.crate_summary') }}
        - type: entities
          show_header_toggle: false
          entities:
            - binary_sensor.crate_bark_sound
            - automation.pet_the_good_girl
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.front_yard_left_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=front_yard_left
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.front_yard_right_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=front_yard_right
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.atrium_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=atrium
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.gate_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=gate
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.garage_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=garage
  - type: picture-entity
    camera_view: auto
    show_name: false
    show_state: false
    entity: camera.back_porch_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=back_porch
  - type: conditional
    conditions:
      - condition: state
        entity: camera.front_door_medium
        tap_action:
          action: navigate
          navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=front_door
        state_not: unavailable
    card:
      type: picture-entity
      camera_view: auto
      show_name: false
      show_state: false
      entity: camera.front_door_medium
      tap_action:
        action: navigate
        navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=front_door
  - type: picture-entity
    camera_view: auto
