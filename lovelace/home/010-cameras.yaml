    show_state: false
    entity: camera.pergola_medium
    tap_action:
      action: navigate
      navigation_path: /lovelace/camera-snapshot?advanced-camera-card-action.snapshot.camera_select=pergola
  - type: picture-entity
    camera_view: auto
    show_name: false
