group:
  great_room_speakers:
    icon: mdi:speaker
    entities:
      - media_player.living_speakers
      - media_player.kitchen_speakers

input_boolean:
  auto_group_tv_audio:
    name: auto-group Lounge TV audio
    icon: mdi:television-speaker

template:
  - sensor:
      - name: house speaker source
        unique_id: house_speaker_source_entity_id
        state: >
          {% if is_state('media_player.screeno', 'playing') and is_state('input_boolean.auto_group_tv_audio', 'on') %}
            media_player.lounge_surround
          {% else %}
            media_player.house
          {% endif %}

script:
  play_or_queue_random_favorite:
    sequence:
      - service: media_player.play_media
        target:
          entity_id: media_player.house
        data:
          media_content_id: >
            {{ state_attr("sensor.sonos_favorites", "items") | list | random }}
          media_content_type: favorite_item_id
          enqueue: >-
            {{ is_state('media_player.house', 'playing') }}

automation:
  - alias: Turn on related speakers
    mode: parallel
    id: 3ba3e202-4fa0-4f94-8f7d-6cf2aeb674c3
    trigger:
      platform: event
      event_type: state_changed
    condition:
      condition: template
      value_template: |
        {{
          trigger.event.data.old_state != None and
          trigger.event.data.new_state.domain == "binary_sensor" and
          is_state(trigger.event.data.new_state.entity_id, "on") and
          trigger.event.data.new_state.attributes.speaker_entity is defined
        }}
    action:
      - service: homeassistant.turn_on
        data:
          entity_id: |
            {{ trigger.event.data.new_state.attributes.speaker_entity }}
  - alias: Turn off related speakers
    mode: parallel
    id: d55dd41d-cd36-4544-8ed1-58b1578ec0ce
    trigger:
      platform: event
      event_type: state_changed
    condition:
      condition: template
      value_template: |
        {{
          trigger.event.data.old_state != None and
          trigger.event.data.new_state.domain == "binary_sensor" and
          is_state(trigger.event.data.new_state.entity_id, "off") and
          trigger.event.data.new_state.attributes.speaker_entity is defined
        }}
    action:
      - service: homeassistant.turn_off
        data:
          entity_id: |
            {{ trigger.event.data.new_state.attributes.speaker_entity }}
  - alias: Group sonos speakers
    mode: parallel
    id: fe8d95bc-f94f-4454-83b0-527b9d403107
    trigger:
      platform: event
      event_type: state_changed
    variables:
      source: "{{ states('sensor.house_speaker_source') }}"
      members: |
        {% set ns = namespace(members=[]) %}
        {% set new_state = trigger.event.data.new_state %}
        {% if new_state is not none %}
          {% for attr in ['media_player_group_member', 'media_player_group_member_2', 'media_player_group_member_3'] %}
            {% set member = new_state.attributes.get(attr) %}
            {% if member and
                  member != source and
                  member not in (state_attr(source, 'group_members') or []) and
                  states(member) in ['idle', 'paused'] %}
              {% set ns.members = ns.members + [member] %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {{ ns.members }}
    condition:
      condition: template
      value_template: |
        {{
          trigger.event.data.old_state != None and
          trigger.event.data.new_state.domain == "binary_sensor" and
          is_state(trigger.event.data.new_state.entity_id, "on") and
          members | count > 0
        }}
    action:
      - service: media_player.join
        data:
          group_members: "{{ members }}"
          entity_id: "{{ source }}"
      - service: system_log.write
        data:
          message: >
            at=media_player.join
            group_members={{ members | join(',') }}
            entity_id={{ source }}
          logger: packages.house_speakers
          level: debug
  - alias: Ungroup sonos speakers
    mode: parallel
    id: b301d317-ef17-4285-a2de-a96353d12712
    trigger:
      platform: event
      event_type: state_changed
    variables:
      members: |
        {% set attrs = ['media_player_group_member', 'media_player_group_member_2', 'media_player_group_member_3'] %}
        {% set ns = namespace(members=[], claimed=[]) %}
        {% set new_state = trigger.event.data.new_state %}
        {% if new_state is not none and new_state.domain == 'binary_sensor' and new_state.state == 'off' %}
          {% for attr in attrs %}
            {% set member = new_state.attributes.get(attr) %}
            {% if member %}
              {% set ns.members = ns.members + [member] %}
            {% endif %}
          {% endfor %}
          {% if ns.members %}
            {# speakers still claimed by another occupied sensor stay grouped #}
            {% for other in states.binary_sensor | selectattr('state', 'eq', 'on') | rejectattr('entity_id', 'eq', new_state.entity_id) %}
              {% for attr in attrs %}
                {% set member = other.attributes.get(attr) %}
                {% if member %}
                  {% set ns.claimed = ns.claimed + [member] %}
                {% endif %}
              {% endfor %}
            {% endfor %}
          {% endif %}
        {% endif %}
        {{ ns.members | reject('in', ns.claimed) | list }}
    condition:
      condition: template
      value_template: |
        {{
          trigger.event.data.old_state != None and
          trigger.event.data.new_state.domain == "binary_sensor" and
          is_state(trigger.event.data.new_state.entity_id, "off") and
          members | count > 0
        }}
    action:
      - service: media_player.unjoin
        data: {}
        target:
          entity_id: "{{ members }}"
      - service: system_log.write
        data:
          message: >
            at=media_player.unjoin
            entity_id={{ members | join(',') }}
          logger: packages.house_speakers
          level: debug
  - alias: Pause house speakers when tvs are playing
    mode: parallel
    id: b6ba810d-20a9-4d2e-8252-f6afefd9824e
    trigger:
      - platform: state
        entity_id: media_player.screeno # temporarily replacing media_player.lounge
        to: playing
      - platform: state
        entity_id: media_player.bedroom
        to: playing
    condition:
      - condition: state
        entity_id: media_player.house
        state: playing
      - condition: state
        entity_id: input_boolean.auto_group_tv_audio
        state: "on"
    action:
      - service: media_player.media_pause
        target:
          entity_id: media_player.house
  - alias: Group house speakers when Sonos paired tvs are playing
    mode: parallel
    id: 08f9e8e3-436e-4228-b507-e83e0e36f033
    trigger:
      - platform: state
        entity_id: media_player.screeno # temporarily replacing media_player.lounge
        to: playing
    condition:
      - condition: state
        entity_id: input_boolean.auto_group_tv_audio
        state: "on"
    action:
      - delay: 3
      - service: media_player.join
        data:
          group_members: media_player.house
          entity_id: |
            {{ states('sensor.house_speaker_source') }}

  - alias: Notify me when the house's queue is almost empty
    mode: single
    id: cec1df2d-51f7-41a3-8074-bde1411fa88c
    trigger:
      platform: state
      entity_id: media_player.house
      attribute: queue_position
    condition:
      condition: template
      value_template: |
        {{
          states('media_player.house') == 'playing' and
          state_attr('media_player.house', 'queue_position') | default(0) > 1 and
          state_attr('media_player.house', 'queue_size') == state_attr('media_player.house', 'queue_position')
        }}

    action:
      - service: script.ack
        data:
          service: script.play_or_queue_random_favorite
          entity_id: media_player.house
          message: >-
            Nearing the end of
            {{ state_attr('media_player.house', 'media_playlist') | default(state_attr('media_player.house', 'media_album_name')) | default(state_attr('media_player.house', 'media_title')) }}.
            Queue up more tunes?
          confirmation_message: >
            queued up more tunes

  - alias: Notify me when the house's queue is empty
    mode: single
    id: d026c8e0-ba8f-46a2-86eb-8649191d8018
    trigger:
      platform: state
      entity_id: media_player.house
      attribute: queue_position
      to: 1
      not_from:
        - "unknown"
        - "unavailable"
        - null
    condition:
      condition: state
      entity_id: media_player.house
      state: paused
    action:
      - service: script.ack
        data:
          service: script.play_or_queue_random_favorite
          entity_id: media_player.house
          message: >-
            {{ state_attr('media_player.house', 'media_playlist') | default(state_attr('media_player.house', 'media_album_name')) | default(state_attr('media_player.house', 'media_title')) | default('Music') }}
            has ended.
            Play more tunes?
          confirmation_message: >
            played more tunes

  - alias: Crank up the volume when the source switches to Airplay
    mode: single
    id: 6947f697-ff72-4135-a06d-10f854525bd2
    trigger:
      platform: state
      entity_id: media_player.house
      attribute: source
      to: Airplay
    action:
      - service: media_player.volume_set
        data:
          volume_level: 0.85
        target:
          entity_id: media_player.house
