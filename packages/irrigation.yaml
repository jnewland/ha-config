input_number:
  pergola_drippers_zone_runtime:
    name: pergola drippers zone runtime
    min: 0
    max: 120
    step: 1
  patio_drippers_zone_runtime:
    name: patio drippers zone runtime
    min: 0
    max: 120
    step: 1
  front_yard_drippers_zone_runtime:
    name: front yard drippers zone runtime
    min: 0
    max: 120
    step: 1
  atrium_drippers_zone_runtime:
    name: atrium drippers zone runtime
    min: 0
    max: 120
    step: 1
  fountain_refill_zone_runtime:
    name: fountain refill zone runtime
    min: 0
    max: 30
    step: 1

automation:
  - alias: Sync zone runtime to input_number
    id: 73557890-f7b8-440d-be70-b7f59b7b1f65
    trigger:
      - platform: state
        entity_id:
          - valve.pergola_pergola_pergola_drippers_zone
          - valve.patio_patio_patio_drippers_zone
          - valve.alley_front_yard_front_yard_drippers_zone
          - valve.atrium_atrium_atrium_drippers_zone
          - valve.atrium_fountain_fountain_refil_zone
        attribute: manual_preset_runtime
    variables:
      # bhyve's entity ids no longer match the short input_number names below,
      # so the mapping has to be explicit instead of derived by string-splitting
      valve_to_runtime:
        valve.atrium_atrium_atrium_drippers_zone: atrium_drippers_zone
        valve.alley_front_yard_front_yard_drippers_zone: front_yard_drippers_zone
        valve.patio_patio_patio_drippers_zone: patio_drippers_zone
        valve.pergola_pergola_pergola_drippers_zone: pergola_drippers_zone
        valve.atrium_fountain_fountain_refil_zone: fountain_refill_zone
    action:
      - service: system_log.write
        data:
          message: >
            at=input_number.set_value
            runtime={{ trigger.to_state.attributes.manual_preset_runtime }}
            entity_id={{ trigger.entity_id }}
            target_entity_id=input_number.{{ valve_to_runtime[trigger.entity_id] }}_runtime
          logger: packages.irrigation
          level: debug
      - service: input_number.set_value
        target:
          entity_id: "input_number.{{ valve_to_runtime[trigger.entity_id] }}_runtime"
        data:
          value: "{{ trigger.to_state.attributes.manual_preset_runtime / 60 }}"
  - alias: Save changed zone's value
    id: d1cbf37d-d177-45d1-95a9-08ea9b4e7e60
    trigger:
      - platform: state
        entity_id:
          - input_number.pergola_drippers_zone_runtime
          - input_number.patio_drippers_zone_runtime
          - input_number.front_yard_drippers_zone_runtime
          - input_number.atrium_drippers_zone_runtime
          - input_number.fountain_refill_zone_runtime
    variables:
      runtime_to_valve:
        input_number.atrium_drippers_zone_runtime: valve.atrium_atrium_atrium_drippers_zone
        input_number.front_yard_drippers_zone_runtime: valve.alley_front_yard_front_yard_drippers_zone
        input_number.patio_drippers_zone_runtime: valve.patio_patio_patio_drippers_zone
        input_number.pergola_drippers_zone_runtime: valve.pergola_pergola_pergola_drippers_zone
        input_number.fountain_refill_zone_runtime: valve.atrium_fountain_fountain_refil_zone
    action:
      - service: system_log.write
        data:
          message: >
            at=bhyve.set_manual_preset_runtime
            minutes={{ trigger.to_state.state }}
            entity_id={{ trigger.entity_id }}
            target_entity_id={{ runtime_to_valve[trigger.entity_id] }}
          logger: packages.irrigation
          level: debug
      - service: bhyve.set_manual_preset_runtime
        target:
          entity_id: "{{ runtime_to_valve[trigger.entity_id] }}"
        data:
          minutes: "{{ trigger.to_state.state }}"
